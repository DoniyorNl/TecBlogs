<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a6f;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Monitor/Screen outline -->
  <rect x="40" y="50" width="120" height="90" rx="8" 
        stroke="url(#mainGrad)" 
        stroke-width="5" 
        fill="none"
        filter="url(#glow)"/>
  
  <!-- Monitor stand -->
  <rect x="90" y="140" width="20" height="15" 
        fill="url(#mainGrad)" 
        rx="2"/>
  <rect x="70" y="155" width="60" height="5" 
        fill="url(#mainGrad)" 
        rx="2"/>
  
  <!-- Code symbols inside screen -->
  <!-- Left bracket -->
  <path d="M 60 70 L 55 70 L 55 120 L 60 120" 
        stroke="url(#accentGrad)" 
        stroke-width="4" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Right bracket -->
  <path d="M 140 70 L 145 70 L 145 120 L 140 120" 
        stroke="url(#accentGrad)" 
        stroke-width="4" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Forward slash -->
  <line x1="110" y1="75" x2="90" y2="115" 
        stroke="url(#accentGrad)" 
        stroke-width="4" 
        stroke-linecap="round"/>
  
  <!-- Decorative code lines -->
  <line x1="70" y1="85" x2="85" y2="85" 
        stroke="#00d4ff" 
        stroke-width="3" 
        stroke-linecap="round" 
        opacity="0.6"/>
  <line x1="70" y1="95" x2="80" y2="95" 
        stroke="#00d4ff" 
        stroke-width="3" 
        stroke-linecap="round" 
        opacity="0.6"/>
  <line x1="115" y1="85" x2="130" y2="85" 
        stroke="#00d4ff" 
        stroke-width="3" 
        stroke-linecap="round" 
        opacity="0.6"/>
  <line x1="120" y1="95" x2="130" y2="95" 
        stroke="#00d4ff" 
        stroke-width="3" 
        stroke-linecap="round" 
        opacity="0.6"/>
  
  <!-- Signal/wifi icon top right -->
  <path d="M 150 35 Q 155 35 157 38" 
        stroke="url(#mainGrad)" 
        stroke-width="2.5" 
        fill="none" 
        stroke-linecap="round"/>
  <path d="M 147 32 Q 155 32 159 38" 
        stroke="url(#mainGrad)" 
        stroke-width="2.5" 
        fill="none" 
        stroke-linecap="round" 
        opacity="0.6"/>
  <circle cx="153" cy="40" r="2" fill="#00d4ff"/>
</svg>